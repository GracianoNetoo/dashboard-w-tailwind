<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&family=Poppins:ital
,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;
1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
</head>
<body>
    <div class="flex">
        <!--Sidebar-->
        <div class="w-64 h-screen overflow-hidden border-r border-gray-300 ">
            <div class="flex flex-col justify-between h-full px-5 py-8">
                <div class="mx-auto">
                    <!--Title-->
                    <div class="text-4xl mb-5 text-center" style="font-family: 'Itim', 'cursive';">Project 2</div>
                    <!--Profile-->
                    <div>
                    <div class="border p-1.5 rounded-full w-fit mx-auto">
                        <div class="h-16 w-16 rounded-full overflow-hidden relative">
                            <img class="absolute top-0 left-0 w-full h-full object-cover" src="assests/img/main.jpeg" alt="">
                        </div>
                    </div>
                    <div class="text-center">
                        <h1 class="font-bold text-lg" style="font-family: 'Itim', 'cursive';">User Name</h1>
                        <p class="text-sm text-gray-700">Chef at Rolex</p>
                        <div class="flex items-center justify-center gap-1">
                            <i class="ri-heart-fill text-red-500"></i>
                            <div class="text-gray-700">255</div>
                        </div>
                    </div>
                    </div>
                    <!--Menu Items-->
                    <div class="mx-auto mt-14">
                        <a href="" class="flex items-center gap-2 text text-gray-500 hover:text-gray-800 mb-3">
                            <i class="ri-book-read-fill"></i>
                            Recipes
                        </a>
                        <a href="" class="flex items-center gap-2 text text-gray-500 hover:text-gray-800 mb-3">
                            <i class="ri-heart-fill"></i>
                            Favourites
                        </a>
                        <a href="" class="flex items-center gap-2 text text-gray-500 hover:text-gray-800 mb-3">
                            <i class="ri-award-fill"></i>
                            Courses
                        </a>
                        <a href="" class="flex items-center gap-2 text text-gray-500 hover:text-gray-800 mb-3">
                            <i class="ri-global-fill"></i>
                            Community
                        </a>
                    </div>
                </div>
                <div class="text-center text-gray-700 bg-red-100 p-2 rounded-md">

                </div> 
            </div>
        </div>
        <!--Main-->
        <div class="bg-gray-50 w-full h-screen overflow-y-scroll p-8">
            <!--Top Bar-->
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2 border-b border-gray-400 pb-1">
                    <i class="ri-search-line text-gray-700"></i>
                    <input type="text" placeholder="Search recipers here..." class="bg-transparent w-80 outline-none border-none">
                </div>
                <div class="bg-red-500 px-10 py-2 rounded-md text-white cursor-pointer">Go to premium</div>
            </div>
            <!--Content-->
            <div>
                <!--Title-->
                <div class="flex justify-between items-center mt-10">
                    <div class="flex items-center gap-5">
                        <img class="h-20 w-20" src="assests/img/prato1.jpg" alt="">
                        <div>
                            <div class="text-5xl font-bold mb-1" style="font-family: 'Itim', 'cursive';">Only the recipes!</div>
                            <div class="text-gray-500">Today's new a recipies for you</div>
                        </div>
                    </div>
                    <div class="flex items-center">
                        <div class="border-r-2 border-gray-300 pr-5">
                            <div class="text-4xl font-bold">167</div>
                            <div class="text-gra-500">Tutorials</div>
                        </div>
                        <div class="pl-5">
                            <div class="text-4xl font-bold">392</div>
                            <div class="text-red-700">Recipies</div>
                        </div>
                    </div>
                </div>
                    <!--Cards-->
                    <div class="grid grid-cols-4 gap-8 mt-10">
                        <div class="border rounded-md bg-white overflow-hidden shadow-md hover:shadow-xl">
                            <div class="p-5 p-0">
                                <img class="h-32 w-32 mx-auto" src="assests/img/prato1.jpg" alt="">
                            </div>
                            <div class="text-lg font-semibold text-center w-full mt-2">
                                Food Name
                            </div>
                            <div class="text-center text-sm w-full bg-red-50 p-1 my-1 mb-1.5">
                                Intermediario
                            </div>
                        <div class="flex items-center justify-between px-5">
                            <div class="text-center">
                                <div class="text-lg font-semibold leading-none">25</div>
                                <div class="text-sm text-gray-500">min</div>
                            </div>
                            <div class="text-center">
                                <div class="text-lg font-semibold leading-none ps-10">95</div>
                                <div class="text-sm text-gray-500 ps-10">cal</div>
                            </div>
                            <div class="text-center">
                                <div class="text-lg font-semibold leading-none">5</div>
                                <div class="text-sm text-gray-500">ingredients</div>
                            </div>
                            </div>
                            <div class="flex items-center text-yellow-300 justify-center gap-2 my-2">
                                <i class="ri-star-fill"></i>
                                <i class="ri-star-fill"></i>
                                <i class="ri-star-fill"></i>
                                <i class="ri-star-fill"></i>
                                <i class="ri-star-fill"></i>
                                </div>
                                <div class="bg-red-500 text-center py-2 text-white cursor-pointer">Comece a cozinhar</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
